name: Deploy altasales-api to VPS

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=critical
        continue-on-error: false

      - name: Create .env file
        run: |
          echo "Creating .env file from secrets..."
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "master" ]; then
            echo "Using ENV_FILE_MASTER secret"
            cat > .env << 'EOF'
          ${{ secrets.ENV_FILE_MASTER }}
          EOF
          else
            echo "Using ENV_FILE_DEVELOP secret"
            cat > .env << 'EOF'
          ${{ secrets.ENV_FILE_DEVELOP }}
          EOF
          fi

          echo ".env file created successfully!"
          echo "File size (bytes and lines):"
          wc .env
          echo "First 3 lines:"
          head -n 3 .env

      - name: Build project
        run: |
          set -a
          source .env
          set +a
          npm run build
        continue-on-error: true

      - name: Prepare deployment archive
        run: |
          echo "Creating deployment directory..."
          mkdir -p deploy

          echo "Verifying .env file exists..."
          ls -la .env
          echo "Content of .env (checking if not empty):"
          wc -l .env
          if [ ! -s .env ]; then
            echo "ERROR: .env file is empty! Check ENV_FILE secret."
            exit 1
          fi

          # Set archive name based on branch
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "$BRANCH_NAME" = "master" ]; then
            ARCHIVE_NAME="altasales-api-master.tar.gz"
          else
            ARCHIVE_NAME="altasales-api.tar.gz"
          fi

          echo "Creating archive with all project files..."
          echo "Branch: $BRANCH_NAME"
          echo "Archive: $ARCHIVE_NAME"
          tar -czf deploy/$ARCHIVE_NAME \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            .

          echo "Archive created successfully!"
          ls -lh deploy/
          echo "Verifying .env in archive:"
          tar -tzf deploy/$ARCHIVE_NAME | grep "\.env"

      - name: Copy archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/altasales-api*.tar.gz"
          target: "/tmp/"
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "Starting deployment..."

            # Determine branch-specific settings
            BRANCH="${{ github.ref_name }}"
            echo "Deploying branch: $BRANCH"

            if [ "$BRANCH" = "master" ]; then
              DEPLOY_DIR="/var/www/altasales-api-master"
              PM2_NAME="altasales-api-master"
              ARCHIVE_NAME="altasales-api-master.tar.gz"
            else
              DEPLOY_DIR="/var/www/altasales-api"
              PM2_NAME="altasales-api"
              ARCHIVE_NAME="altasales-api.tar.gz"
            fi

            echo "Deploy directory: $DEPLOY_DIR"
            echo "PM2 process name: $PM2_NAME"
            echo "Archive name: $ARCHIVE_NAME"

            # Clean up old deployment
            echo "Cleaning old deployment..."
            rm -rf $DEPLOY_DIR
            mkdir -p $DEPLOY_DIR

            # Extract archive
            echo "Extracting archive..."
            tar -xzf /tmp/$ARCHIVE_NAME -C $DEPLOY_DIR/

            # Clean up archive
            rm -f /tmp/$ARCHIVE_NAME

            # Navigate to project directory
            cd $DEPLOY_DIR

            # Verify .env file exists
            echo "Verifying .env file..."
            ls -la .env
            echo "Content check:"
            head -n 3 .env

            # Load environment variables
            echo "Loading environment variables from .env..."
            set -a
            source .env
            set +a

            # Run database migrations against the deploy DB
            echo "Running database migrations..."
            npm run migration:run:prod

            # PM2 deployment
            echo "Managing PM2 process..."
            if pm2 describe $PM2_NAME > /dev/null 2>&1; then
              echo "Stopping existing PM2 process..."
              pm2 delete $PM2_NAME
            fi

            echo "Starting PM2 process with environment variables..."
            pm2 start npm --name $PM2_NAME --update-env -- run start

            # Verify the process is running
            pm2 show $PM2_NAME

            # Configure PM2 to start on system boot
            echo "Configuring PM2 startup..."
            pm2 startup || true

            # Save PM2 process list
            echo "Saving PM2 process list..."
            pm2 save

            # Show PM2 status
            pm2 list

            echo "Deployment completed successfully!"
